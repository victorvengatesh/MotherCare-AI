name: MotherCare AI CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend regression tests
        env:
          GEMINI_API_KEY: "mock-key-for-ci"
          MC_SECRET_KEY: "ci-secret-key-at-least-32-characters-long"
          DATABASE_URL: "sqlite:///:memory:"
          ALLOWED_ORIGINS: "http://localhost:5173"
        run: |
          cd backend
          python -m pytest -q \
            tests/test_main.py \
            tests/test_auth_security.py \
            tests/test_upload_security.py \
            tests/test_orchestrator_safety.py \
            tests/test_redflag.py \
            tests/test_phase5.py

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm run test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose configuration
        run: docker compose config
