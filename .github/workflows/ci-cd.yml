name: MotherCare AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Validation ────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend test suite
        env:
          GEMINI_API_KEY: "mock-key-for-ci"
          MC_SECRET_KEY: "mock-secret-for-ci-at-least-32-characters"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          cd backend
          python -m pytest -q

  # ── Frontend Validation ───────────────────────────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ── Docker Environment Validation ─────────────────────────────────────────────
  docker-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate temporary TLS certificate
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/certs/mothercare.key \
            -out nginx/certs/mothercare.crt \
            -subj "/CN=localhost"
          test -s nginx/certs/mothercare.key
          test -s nginx/certs/mothercare.crt

      - name: Verify Docker Compose Configuration
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          DATABASE_URL: postgresql://mothercare:ci-only-database-password@postgres:5432/mothercare_db
          MC_SECRET_KEY: ci-only-secret-key-at-least-32-characters
          GEMINI_API_KEY: mock-key-for-ci
        run: docker compose config --quiet
